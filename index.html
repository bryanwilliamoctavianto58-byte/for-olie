<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b080d">
<title>Blow-Out Birthday Cake</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700&family=Kalam:wght@400;700&family=Shrikhand&display=swap">
<style>
:root{
  /* full-screen candlelit scene, controls docked at the bottom, the card rises over the cake at the end */
  --room:#0b080d;
  --cream:#f5e9d6;
  --cream-dim:#bcab99;
  --flame:#ffb547;
  --flame-deep:#ff7a2f;
  --on-flame:#2a1408;
  --cherry:#c62a43;
  --cherry-ink:#a51f36;
  --paper:#f7eedf;
  --paper-ink:#2b1610;
  --tape:rgba(140,196,150,.78);
  --glass:rgba(22,15,20,.78);
  --line:rgba(245,233,214,.14);
  --track:rgba(245,233,214,.1);
  --f-display:"Shrikhand","Cooper Black",Georgia,serif;
  --f-ui:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-note:"Kalam","Segoe Print","Comic Sans MS",cursive;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--room);color:var(--cream);font-family:var(--f-ui);overflow:hidden;-webkit-tap-highlight-color:transparent}
#scene,#confetti{position:fixed;inset:0;width:100%;height:100%;display:block}
#scene{touch-action:none;cursor:grab}
#scene.dragging{cursor:grabbing}
#confetti{pointer-events:none;z-index:2}

.mute{position:fixed;z-index:5;top:calc(12px + env(safe-area-inset-top,0px));right:calc(12px + env(safe-area-inset-right,0px));width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:var(--glass);border:1px solid var(--line);color:var(--cream);cursor:pointer;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.mute svg{width:20px;height:20px}

.dock,.note-wrap{position:fixed;left:0;right:0;bottom:0;z-index:4;display:flex;justify-content:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.panel{pointer-events:auto;width:100%;max-width:30rem;display:grid;gap:12px;padding:18px 20px 20px;background:var(--glass);border:1px solid var(--line);border-radius:18px;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.eyebrow{margin:0;font-size:.72rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--flame)}
.display{margin:0;font-family:var(--f-display);font-weight:400;line-height:1.08;text-wrap:balance}
h1.display{font-size:clamp(1.7rem,6.4vw,2.3rem);color:var(--cream)}
.lede{margin:0;max-width:60ch;font-size:.97rem;line-height:1.5;color:var(--cream-dim)}
.fine{margin:0;font-size:.76rem;line-height:1.45;color:var(--cream-dim)}
.row{display:flex;flex-wrap:wrap;gap:10px}

.btn{font:inherit;font-size:.95rem;font-weight:600;border-radius:999px;padding:12px 18px;border:1px solid transparent;cursor:pointer;transition:transform .12s ease,background-color .2s ease,filter .2s ease;-webkit-user-select:none;user-select:none}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn:focus-visible,.mute:focus-visible{outline:2px solid var(--flame);outline-offset:3px}
.primary{background:var(--flame);color:var(--on-flame)}
.primary:hover{filter:brightness(1.07)}
.ghost{background:transparent;color:var(--cream);border-color:var(--line)}
.ghost:hover{border-color:var(--cream-dim)}

.status-row{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.status{margin:0;font-size:1.05rem;font-weight:600;min-width:0}
.count{margin:0;font-size:.85rem;color:var(--cream-dim);font-variant-numeric:tabular-nums;white-space:nowrap}
.meter{position:relative;height:10px;border-radius:99px;background:var(--track);overflow:hidden}
.meter-fill{position:absolute;inset:0;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,var(--flame-deep),var(--flame))}
.meter-mark{position:absolute;top:0;bottom:0;width:2px;left:30%;background:var(--cream);opacity:.55}
.hold{width:100%;background:transparent;color:var(--cream-dim);border-color:var(--line);font-size:.85rem;padding:10px 16px;touch-action:none;-webkit-touch-callout:none}
.hold.main{background:var(--flame);color:var(--on-flame);border-color:transparent;font-size:1.05rem;padding:16px 18px}
.hold.active{transform:scale(.97);filter:brightness(1.12)}
.hold:not(.main).active{border-color:var(--flame);color:var(--cream)}

.wish{position:fixed;inset:0;z-index:3;display:grid;place-items:center;pointer-events:none;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:30vh;font-family:var(--f-display);font-size:clamp(2.6rem,11vw,5rem);color:var(--cream);text-align:center;text-shadow:0 0 34px rgba(255,181,71,.55);opacity:0;transform:scale(.96);transition:opacity .6s ease,transform 1.4s ease}
.wish.show{opacity:1;transform:scale(1)}

.note{pointer-events:auto;position:relative;width:100%;max-width:26rem;display:grid;gap:12px;padding:30px 24px 22px;background:var(--paper);color:var(--paper-ink);border-radius:4px;transform:rotate(-1.2deg);box-shadow:0 26px 60px -18px rgba(0,0,0,.75),0 2px 0 rgba(0,0,0,.08);animation:rise .8s cubic-bezier(.2,.8,.2,1) both}
.note::before{content:"";position:absolute;top:-12px;left:50%;width:96px;height:26px;transform:translateX(-50%) rotate(2.5deg);background:var(--tape);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.note h2{font-size:clamp(1.6rem,6vw,2.05rem);color:var(--cherry-ink)}
.note-msg{margin:0;font-family:var(--f-note);font-size:1.18rem;line-height:1.45}
.note-sign{margin:0;font-family:var(--f-note);font-weight:700;font-size:1.15rem;text-align:right}
.again{justify-self:start;background:var(--paper-ink);color:var(--paper)}
.again:focus-visible{outline-color:var(--cherry-ink)}
@keyframes rise{from{opacity:0;transform:translateY(40px) rotate(2deg)}to{opacity:1;transform:translateY(0) rotate(-1.2deg)}}

@media (min-width:720px){
  .panel{padding:22px 24px 24px}
}
@media (prefers-reduced-motion:reduce){
  .note{animation:none}
  .wish{transition:opacity .3s ease}
}
</style>
</head>
<body>
<canvas id="scene" aria-label="A birthday cake with lit candles"></canvas>
<canvas id="confetti" aria-hidden="true"></canvas>

<button id="mute" class="mute" type="button" aria-label="Mute sound" aria-pressed="false">
  <svg id="iconOn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/></svg>
  <svg id="iconOff" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m22 9-6 6"/><path d="m16 9 6 6"/></svg>
</button>

<div class="dock">
  <section class="panel" id="introPanel">
    <p class="eyebrow" id="introEyebrow">For Olie · from Bryan</p>
    <h1 class="display">Make a wish, then blow.</h1>
    <p class="lede" id="lede">This cake can hear you. Turn on the mic and blow the candles out like it's a real cake.</p>
    <div class="row">
      <button id="startMic" class="btn primary" type="button">Turn on the microphone</button>
      <button id="startHold" class="btn ghost" type="button">No mic? Use a button</button>
    </div>
    <p class="fine">The mic only listens for your breath. Nothing gets recorded or sent anywhere.</p>
  </section>

  <section class="panel" id="playPanel" hidden>
    <div class="status-row">
      <p class="status" id="status" aria-live="polite">Blow into the microphone.</p>
      <p class="count" id="count">7 of 7 still burning</p>
    </div>
    <div class="meter" aria-hidden="true"><div class="meter-fill" id="meterFill"></div><div class="meter-mark" id="meterMark"></div></div>
    <button id="hold" class="btn hold" type="button">Mic not working? Hold here to blow</button>
  </section>
</div>

<div class="wish" id="wish" aria-hidden="true">Wish made.</div>

<div class="note-wrap" id="noteWrap" hidden>
  <article class="note" aria-live="polite">
    <h2 class="display" id="noteTitle">Happy birthday!</h2>
    <p class="note-msg" id="noteMsg"></p>
    <p class="note-sign" id="noteSign"></p>
    <button id="again" class="btn again" type="button">Light them again</button>
  </article>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function () {
"use strict";

// ---------- edit these ----------
const CONFIG = {
  name: "Olie",       // written on top of the cake
  age: 17,            // for "Happy 17th birthday", set to 0 to leave the number out
  from: "Bryan",
  candles: 7,         // 1 to 14
  message: "Seventeen looks good on you. Thanks for another year of late-night calls, terrible jokes and pretending to study together. The next es teh is on me.",
  sensitivity: 1      // 1.5 if blowing barely does anything, 0.7 if talking blows them out
};
// --------------------------------

const $ = id => document.getElementById(id);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const coarse = matchMedia("(pointer: coarse)").matches;
const N = clamp(Math.round(CONFIG.candles) || 1, 1, 14);

function ordinal(n) {
  const s = ["th", "st", "nd", "rd"], v = n % 100;
  return n + (s[(v - 20) % 10] || s[v] || s[0]);
}

document.title = CONFIG.name + "'s Birthday Cake";
$("introEyebrow").textContent = "For " + CONFIG.name + " · from " + CONFIG.from;
$("noteTitle").textContent = CONFIG.age ? "Happy " + ordinal(CONFIG.age) + " birthday, " + CONFIG.name + "!" : "Happy birthday, " + CONFIG.name + "!";
$("noteMsg").textContent = CONFIG.message;
$("noteSign").textContent = "from " + CONFIG.from;
if (coarse) $("lede").textContent = "This cake can hear you. Turn on the mic and blow at the bottom of your phone like it's a real cake.";

function failScene() {
  $("lede").textContent = "The cake couldn't load. Check the internet connection and refresh the page.";
  $("startMic").disabled = true;
  $("startHold").disabled = true;
}
if (!window.THREE) { failScene(); return; }

// ---------- renderer ----------
const canvas = $("scene");
let renderer;
try { renderer = new THREE.WebGLRenderer({ canvas, antialias: true }); }
catch (e) { failScene(); return; }
renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const lin = hex => new THREE.Color(hex).convertSRGBToLinear();
const scene = new THREE.Scene();
const BG_DARK = new THREE.Color("#0b080d"), BG_LIT = new THREE.Color("#2d1d29");
const FOG_DARK = lin("#0b080d"), FOG_LIT = lin("#2d1d29");
scene.background = BG_DARK.clone();
scene.fog = new THREE.Fog(FOG_DARK.clone(), 9, 20);
const camera = new THREE.PerspectiveCamera(32, 1, 0.1, 100);

function mulberry32(a) {
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const rand = mulberry32(1710);

function canvasTex(w, h, draw, srgb = true) {
  const c = document.createElement("canvas");
  c.width = w; c.height = h;
  draw(c.getContext("2d"), w, h);
  const t = new THREE.CanvasTexture(c);
  if (srgb) t.encoding = THREE.sRGBEncoding;
  t.anisotropy = maxAniso;
  return t;
}
function blob(g, cx, cy, rx, ry, stops) {
  g.save(); g.translate(cx, cy); g.scale(1, ry / rx);
  const gr = g.createRadialGradient(0, 0, 0, 0, 0, rx);
  stops.forEach(([o, c]) => gr.addColorStop(o, c));
  g.fillStyle = gr; g.beginPath(); g.arc(0, 0, rx, 0, Math.PI * 2); g.fill(); g.restore();
}

// ---------- textures ----------
const flameTex = canvasTex(64, 160, g => {
  g.globalCompositeOperation = "lighter";
  blob(g, 32, 112, 24, 44, [[0, "rgba(255,214,140,0.95)"], [0.45, "rgba(255,150,50,0.7)"], [0.8, "rgba(255,80,20,0.18)"], [1, "rgba(255,60,0,0)"]]);
  blob(g, 32, 74, 13, 62, [[0, "rgba(255,200,110,0.7)"], [0.6, "rgba(255,120,40,0.25)"], [1, "rgba(255,80,0,0)"]]);
  blob(g, 32, 142, 9, 12, [[0, "rgba(110,140,255,0.55)"], [1, "rgba(80,100,255,0)"]]);
});
const coreTex = canvasTex(64, 160, g => {
  blob(g, 32, 118, 11, 28, [[0, "rgba(255,255,245,1)"], [0.5, "rgba(255,240,190,0.8)"], [1, "rgba(255,220,150,0)"]]);
});
const glowTex = canvasTex(128, 128, (g, w) => {
  blob(g, w / 2, w / 2, w / 2, w / 2, [[0, "rgba(255,180,90,0.55)"], [0.3, "rgba(255,140,60,0.18)"], [1, "rgba(255,120,40,0)"]]);
});
const emberTex = canvasTex(32, 32, g => {
  blob(g, 16, 16, 16, 16, [[0, "rgba(255,170,80,1)"], [0.4, "rgba(255,90,30,0.6)"], [1, "rgba(255,60,0,0)"]]);
});
const smokeTex = canvasTex(64, 64, g => {
  blob(g, 32, 32, 32, 32, [[0, "rgba(205,200,212,0.55)"], [0.5, "rgba(175,170,185,0.22)"], [1, "rgba(160,155,170,0)"]]);
});
const shadowTex = canvasTex(256, 256, g => {
  blob(g, 128, 128, 128, 128, [[0, "rgba(0,0,0,0.7)"], [0.5, "rgba(0,0,0,0.4)"], [1, "rgba(0,0,0,0)"]]);
});
const chocoTex = canvasTex(512, 128, (g, w, h) => {
  g.fillStyle = "#6a3a27"; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 900; i++) {
    const x = rand() * w, ww = 0.6 + rand() * 2.4;
    g.fillStyle = rand() < 0.5 ? "rgba(40,18,10," + (0.15 + rand() * 0.35) + ")" : "rgba(150,95,65," + (0.08 + rand() * 0.25) + ")";
    g.fillRect(x, rand() * h * 0.3, ww, h * (0.5 + rand() * 0.6));
  }
});
chocoTex.wrapS = THREE.RepeatWrapping;
chocoTex.repeat.set(4, 1);
function stripeTex(a, b) {
  const t = canvasTex(64, 256, (g, w, h) => {
    g.fillStyle = a; g.fillRect(0, 0, w, h);
    g.fillStyle = b; g.save(); g.translate(w / 2, h / 2); g.rotate(-0.5);
    for (let y = -h; y < h; y += 36) g.fillRect(-w * 3, y, w * 6, 13);
    g.restore();
  });
  t.wrapS = THREE.RepeatWrapping;
  return t;
}

// ---------- lights ----------
const ambient = new THREE.AmbientLight(lin("#3a2a40"), 0.14);
const hemi = new THREE.HemisphereLight(lin("#ffe2c9"), lin("#2a1a24"), 0);
const rim = new THREE.DirectionalLight(lin("#8a84ff"), 0.4);
rim.position.set(-4, 5, -5);
const candleLight = new THREE.PointLight(lin("#ffb04a"), 0, 9, 2);
const frontFill = new THREE.PointLight(lin("#ff9a50"), 0, 8, 2);
frontFill.position.set(0, 1.3, 2.7);
scene.add(ambient, hemi, rim, candleLight, frontFill);

// ---------- table ----------
const table = new THREE.Mesh(new THREE.CircleGeometry(16, 64), new THREE.MeshStandardMaterial({ color: lin("#2a1a20"), roughness: 0.95 }));
table.rotation.x = -Math.PI / 2;
scene.add(table);
const shadow = new THREE.Mesh(new THREE.PlaneGeometry(4.6, 4.6), new THREE.MeshBasicMaterial({ map: shadowTex, transparent: true, depthWrite: false }));
shadow.rotation.x = -Math.PI / 2; shadow.position.y = 0.003;
scene.add(shadow);

// ---------- cake ----------
const cake = new THREE.Group();
scene.add(cake);
const chocoMat = new THREE.MeshStandardMaterial({ color: lin("#a06a52"), map: chocoTex, bumpMap: chocoTex, bumpScale: 0.012, roughness: 0.62 });
const creamMat = new THREE.MeshStandardMaterial({ color: lin("#f7ecdb"), roughness: 0.5, side: THREE.DoubleSide });
const cherryMat = new THREE.MeshStandardMaterial({ color: lin("#b0142e"), roughness: 0.18, emissive: lin("#2a0006") });
const stemMat = new THREE.MeshStandardMaterial({ color: lin("#4d5a2c"), roughness: 0.8 });
const boardMat = new THREE.MeshStandardMaterial({ color: lin("#c9a35a"), roughness: 0.35, metalness: 0.55 });

const BOARD_H = 0.07, B_R = 1.35, B_H = 0.85, T_R = 1.0, T_H = 0.7, CAP = 0.03;
const bTop = BOARD_H + B_H;
const tBase = bTop + CAP;
const tTop = tBase + T_H;
const tSurface = tTop + CAP;

const board = new THREE.Mesh(new THREE.CylinderGeometry(1.62, 1.64, BOARD_H, 96), boardMat);
board.position.y = BOARD_H / 2;
cake.add(board);

function tier(R, H, baseY, dripMax, seed) {
  const body = new THREE.Mesh(new THREE.CylinderGeometry(R, R, H, 96), chocoMat);
  body.position.y = baseY + H / 2;
  cake.add(body);

  // cream drip: an open cylinder whose lower edge follows a wavy length profile
  const r = mulberry32(seed);
  const count = 11 + Math.floor(r() * 5);
  const drips = [];
  for (let i = 0; i < count; i++) drips.push({ c: (i + r() * 0.6) / count * Math.PI * 2 - Math.PI, w: 0.07 + r() * 0.09, l: (0.25 + r() * 0.75) * dripMax });
  const base = dripMax * 0.16;
  const len = th => {
    let m = base + Math.sin(th * 23) * 0.006;
    for (const d of drips) {
      let dd = Math.abs(th - d.c); dd = Math.min(dd, Math.PI * 2 - dd);
      if (dd < d.w) { const v = d.l * Math.sqrt(1 - (dd / d.w) ** 2); if (v > m) m = v; }
    }
    return m;
  };
  const topY = baseY + H;
  const geo = new THREE.CylinderGeometry(R + 0.012, R + 0.012, 1, 256, 24, true);
  const p = geo.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const t = p.getY(i) + 0.5;
    p.setY(i, topY - (1 - t) * len(Math.atan2(p.getZ(i), p.getX(i))));
  }
  geo.computeVertexNormals();
  cake.add(new THREE.Mesh(geo, creamMat));

  const cap = new THREE.Mesh(new THREE.CylinderGeometry(R + 0.012, R + 0.012, CAP, 128), creamMat);
  cap.position.y = topY + CAP / 2;
  cake.add(cap);
  const lip = new THREE.Mesh(new THREE.TorusGeometry(R - 0.004, 0.03, 12, 128), creamMat);
  lip.rotation.x = Math.PI / 2; lip.position.y = topY + CAP * 0.7;
  cake.add(lip);
}
tier(B_R, B_H, BOARD_H, 0.5, 11);
tier(T_R, T_H, tBase, 0.42, 29);

// piped rosettes with a cherry each, round the lower ledge
const rosetteGeo = (() => {
  const pts = [[0, 0], [0.09, 0.01], [0.095, 0.045], [0.08, 0.09], [0.055, 0.125], [0.025, 0.15], [0, 0.165]].map(([x, y]) => new THREE.Vector2(x, y));
  const g = new THREE.LatheGeometry(pts, 48);
  const p = g.attributes.position;
  for (let i = 0; i < p.count; i++) {
    const x = p.getX(i), y = p.getY(i), z = p.getZ(i);
    const th = Math.atan2(z, x);
    const k = 1 + 0.15 * Math.cos(8 * (th + y * 9));
    p.setX(i, x * k); p.setZ(i, z * k);
  }
  g.computeVertexNormals();
  return g;
})();
const cherryGeo = new THREE.SphereGeometry(0.068, 24, 18);
const stemGeo = new THREE.CylinderGeometry(0.006, 0.005, 0.12, 6);
const ROSETTES = 14;
for (let i = 0; i < ROSETTES; i++) {
  const a = (i + 0.5) / ROSETTES * Math.PI * 2;
  const x = Math.cos(a) * 1.18, z = Math.sin(a) * 1.18;
  const ro = new THREE.Mesh(rosetteGeo, creamMat);
  ro.position.set(x, bTop + CAP - 0.005, z);
  ro.rotation.y = rand() * 6.28;
  cake.add(ro);
  const ch = new THREE.Mesh(cherryGeo, cherryMat);
  ch.scale.set(1, 0.92, 1);
  ch.position.set(x, bTop + CAP + 0.2, z);
  cake.add(ch);
  const st = new THREE.Mesh(stemGeo, stemMat);
  st.position.set(x + 0.02, bTop + CAP + 0.3, z);
  st.rotation.z = -0.45; st.rotation.y = rand() * 6.28;
  cake.add(st);
}

// name piped on top in chocolate
const nameCanvas = document.createElement("canvas");
nameCanvas.width = 1024; nameCanvas.height = 384;
const nameTex = new THREE.CanvasTexture(nameCanvas);
nameTex.encoding = THREE.sRGBEncoding;
nameTex.anisotropy = maxAniso;
function drawName() {
  const g = nameCanvas.getContext("2d"), txt = CONFIG.name;
  g.clearRect(0, 0, 1024, 384);
  g.textAlign = "center"; g.textBaseline = "middle";
  let size = 210;
  for (; size > 60; size -= 8) {
    g.font = size + 'px "Shrikhand", Georgia, serif';
    if (g.measureText(txt).width < 900) break;
  }
  g.lineJoin = "round";
  g.lineWidth = size * 0.09;
  g.strokeStyle = "rgba(40,18,8,0.95)";
  g.fillStyle = "#5c2d18";
  g.strokeText(txt, 512, 200);
  g.fillText(txt, 512, 200);
  g.save();

  frontFill.intensity = 1.3 * cf * flick + 0.3 * room;
  ambient.intensity = 0.2 + 0.3 * room;
  hemi.intensity = 1.0 * room;
  halo.material.opacity = 0.2 * cf * flick;
  scene.background.copy(BG_DARK).lerp(BG_LIT, room);
  scene.fog.color.copy(FOG_DARK).lerp(FOG_LIT, room);

  renderer.render(scene, camera);
  updateConfetti(dt);

  // ui
  if (state === "calibrating" || state === "playing") {
    let s;
    if (notice) s = notice;
    else if (state === "calibrating") s = "Listening to the room. Stay quiet for a second…";
    else if (relighting) s = "Lighting the candles…";
    else if (mode === "mic") s = sNow > 0.5 ? "Yes! Keep blowing!" : sNow > 0.05 ? "Harder!" : (coarse ? "Blow at the bottom of your phone." : "Blow into the microphone.");
    else s = holding ? "Whoosh…" : "Press and hold the button to blow.";
    setText(statusEl, s, "status");
    setText(countEl, litCount + " of " + N + " still burning", "count");
    const level = mode === "mic" ? Math.max(meterLevel, holding ? sNow : 0) : sNow;
    meterFill.style.transform = "scaleX(" + level.toFixed(3) + ")";
    meterMark.style.left = (meterMarkPos * 100).toFixed(1) + "%";
  }

  requestAnimationFrame(loop);
}

frame();
window.addEventListener("resize", frame);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
